<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Temperature Converter</title>
  <style>
  body{
  font-family:Arial,sans-serif;
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#4f46e5,#06b6d4);
}
.container{
  padding:20px;
  background:#f9fafb;
  border-radius:12px;
}
.field{
  display:flex;
  gap:10px;
  margin-top:15px;
}
button{
  border:none;
  background:#4f46e5;
  color:#fff;
  cursor:pointer;
  transition:.3s;
}
button:hover{
  background:#3730a3;
}
.result{
  margin-top:15px;
  padding:12px;
  border-radius:8px;
  font-weight:bold;
}
  </style>
</head>
<body>
    <div class="container">
      <h2>Fahrenheit to Celsius</h2>
      <div class="field">
        <input id="fahrenheitInput" type="number" placeholder="Enter °F" />
        <button onclick="convertToCelsius()">Convert</button>
      </div>
      <p id="celsiusResult" class="result">Result will appear here.</p>
    </div>
  </div>

  <script>
    function convertToCelsius() {
      const fahrenheit = parseFloat(document.getElementById('fahrenheitInput').value);
      const result = document.getElementById('celsiusResult');

      if (Number.isNaN(fahrenheit)) {
        result.textContent = 'Please enter a valid Fahrenheit value.';
        return;
      }

      const celsius = ((fahrenheit - 32) * 5) / 9;
      result.textContent = `${fahrenheit.toFixed(2)} °F = ${celsius.toFixed(2)} °C`;
    }
  </script>
</body>
</html>
